services:
  connect4:
    image: "ghcr.io/wri-obernburg/connect4rv6l:main"
    ports:
      - "4000:4000"
      - "3000:3000"
    environment:
      - FRONTEND_ADDRESS=https://connect4rv6l.vercel.app/
      # Telegram bot for critical faults, off while empty
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      # fault memory and logs of the backend, kept when the container is replaced by a new image
      - ./logs:/app/backend/logs
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://connect4:3000 run --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped